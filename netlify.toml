# Static landing page. No build step.
[build]
  publish = "."
  command = "echo 'static site, nothing to build'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/og.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/demo.gif"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Keep Google's verification file reachable on the old address so the
# Search Console change of address can re-verify it.
[[redirects]]
  from = "https://brightspace-mcp.netlify.app/google3fe45c4490f93b23.html"
  to = "/google3fe45c4490f93b23.html"
  status = 200
  force = true

# Old Netlify address now permanently redirects to the custom domain.
[[redirects]]
  from = "https://brightspace-mcp.netlify.app/*"
  to = "https://brightspacemcp.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/brightspace-setup.cmd"
  [headers.values]
    Content-Type = "application/octet-stream"
    Content-Disposition = "attachment; filename=\"brightspace-setup.cmd\""

[[headers]]
  for = "/install.sh"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=300"
